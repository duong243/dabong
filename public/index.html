<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚽ 3D Football Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family:sans-serif; }
  canvas { display:block; }
  
  #ui {
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:22px; font-weight:bold;
    background:rgba(0,0,0,0.6); padding:8px 24px; border-radius:20px;
    text-shadow:1px 1px 3px #000; z-index:10; white-space:nowrap;
  }
  #teamInfo {
    position:fixed; top:10px; left:10px;
    color:#fff; font-size:14px; background:rgba(0,0,0,0.6);
    padding:6px 14px; border-radius:12px; z-index:10;
  }
  
  /* Mobile */
  #joystick {
    position:fixed; bottom:30px; left:30px;
    width:140px; height:140px;
    background:rgba(255,255,255,0.15);
    border:2px solid rgba(255,255,255,0.4);
    border-radius:50%;
    touch-action:none;
    display:none;
  }
  #stick {
    position:absolute; top:50%; left:50%;
    width:60px; height:60px; margin:-30px 0 0 -30px;
    background:rgba(255,255,255,0.7);
    border-radius:50%;
  }
  #actions {
    position:fixed; bottom:30px; right:30px;
    display:none; flex-direction:column; gap:12px;
  }
  .btn {
    width:80px; height:80px; border-radius:50%;
    background:rgba(0,150,255,0.6);
    border:2px solid rgba(255,255,255,0.7);
    color:#fff; font-size:14px; font-weight:bold;
    touch-action:none;
  }
  .btn:active { background:rgba(0,200,255,0.9); transform:scale(0.95); }
  #kickBtn { background:rgba(255,80,80,0.6); }
  #kickBtn:active { background:rgba(255,120,120,0.9); }
  
  #hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    color:#aaa; font-size:13px; text-align:center;
  }
  
  #loading {
    position:fixed; inset:0; background:#111; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; z-index:100; flex-direction:column; gap:16px;
  }
  
  #goalFlash {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:72px; font-weight:bold; color:#fff; text-shadow:0 0 20px #ffcc00;
    pointer-events:none; opacity:0; transition:opacity 0.3s; z-index:50;
  }
  
  @media (max-width: 768px) {
    #joystick { display:block; }
    #actions { display:flex; }
    #hint { display:none; }
    #ui { font-size:16px; }
  }
</style>
</head>
<body>

<div id="loading">⚽ Đang kết nối server...</div>
<div id="ui">⚽ 0 - 0</div>
<div id="teamInfo">Team: —</div>
<div id="goalFlash">GOAL!</div>

<div id="joystick"><div id="stick"></div></div>
<div id="actions">
  <button class="btn" id="kickBtn">SÚT</button>
  <button class="btn" id="sprintBtn">CHẠY</button>
</div>

<div id="hint">WASD / Mũi tên di chuyển · SPACE sút · SHIFT chạy nhanh</div>

<script src="/socket.io/socket.io.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============ SOCKET ============
const socket = io();
let myId = null;
let gameState = null;
let teamColors = { red: 0xff3333, blue: 0x3366ff };

// ============ SCENE ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 160);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 20, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ============ LIGHTS ============
scene.add(new THREE.HemisphereLight(0xffffff, 0x446644, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

// ============ FIELD (giống hệt bản AI) ============
const FIELD_W = 44, FIELD_H = 60;

const grass = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_W, FIELD_H),
  new THREE.MeshLambertMaterial({ color: 0x3a9d3a })
);
grass.rotation.x = -Math.PI/2;
grass.receiveShadow = true;
scene.add(grass);

for (let i = 0; i < 12; i++) {
  if (i % 2 === 0) continue;
  const stripe = new THREE.Mesh(
    new THREE.PlaneGeometry(FIELD_W, FIELD_H/12),
    new THREE.MeshLambertMaterial({ color: 0x2e8a2e })
  );
  stripe.rotation.x = -Math.PI/2;
  stripe.position.z = -FIELD_H/2 + (i + 0.5) * (FIELD_H/12);
  stripe.position.y = 0.01;
  scene.add(stripe);
}

const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
function addLine(w, h, x, z) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), lineMat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x, 0.02, z);
  scene.add(m);
}
addLine(FIELD_W, 0.2, 0, -FIELD_H/2);
addLine(FIELD_W, 0.2, 0, FIELD_H/2);
addLine(0.2, FIELD_H, -FIELD_W/2, 0);
addLine(0.2, FIELD_H, FIELD_W/2, 0);
addLine(FIELD_W, 0.2, 0, 0);

const circle = new THREE.Mesh(new THREE.RingGeometry(5.5, 5.7, 48), lineMat);
circle.rotation.x = -Math.PI/2;
circle.position.y = 0.02;
scene.add(circle);

// Khung thành
function makeGoal(z, color) {
  const g = new THREE.Group();
  const m = new THREE.MeshLambertMaterial({ color });
  const w = 10, h = 3;
  const bar = new THREE.CylinderGeometry(0.15, 0.15, h, 8);
  
  [-w/2, w/2].forEach(x => {
    const b = new THREE.Mesh(bar, m);
    b.position.set(x, h/2, 0);
    b.castShadow = true;
    g.add(b);
  });
  const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, w, 8), m);
  cross.rotation.z = Math.PI/2;
  cross.position.y = h;
  cross.castShadow = true;
  g.add(cross);
  
  g.position.z = z;
  scene.add(g);
}
makeGoal(-FIELD_H/2 + 0.5, 0x3366ff); // khung xanh (team blue ghi)
makeGoal(FIELD_H/2 - 0.5, 0xff3333);  // khung đỏ (team red ghi)

// ============ BALL ============
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 24, 24),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 })
);
ball.castShadow = true;
scene.add(ball);

// ============ PLAYER MODEL ============
function createPlayerModel(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.5, 1.0, 4, 12),
    new THREE.MeshStandardMaterial({ color })
  );
  body.position.y = 1.3;
  body.castShadow = true;
  g.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
  );
  head.position.y = 2.5;
  head.castShadow = true;
  g.add(head);
  
  const legMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
  [-0.2, 0.2].forEach(x => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.9, 8), legMat);
    leg.position.set(x, 0.45, 0);
    leg.castShadow = true;
    g.add(leg);
  });
  
  // Name label
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,256,64);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Player', 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const label = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 0.75),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
  );
  label.position.y = 3.5;
  label.name = 'label';
  g.add(label);
  
  return g;
}

const playerModels = {}; // id -> Group

// ============ INPUT ============
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

// Joystick
const joyEl = document.getElementById('joystick');
const stickEl = document.getElementById('stick');
let joyActive = false, joyX = 0, joyY = 0, joyId = null;

function joyStart(e) {
  const t = e.changedTouches ? e.changedTouches[0] : e;
  joyId = t.identifier ?? 'mouse';
  joyActive = true;
  joyMove(e);
  e.preventDefault();
}
function joyMove(e) {
  if (!joyActive) return;
  let t = e.changedTouches
    ? Array.from(e.changedTouches).find(tt => tt.identifier === joyId)
    : e;
  if (!t) return;
  const r = joyEl.getBoundingClientRect();
  let dx = t.clientX - (r.left + r.width/2);
  let dy = t.clientY - (r.top + r.height/2);
  const max = r.width/2;
  const d = Math.hypot(dx, dy);
  if (d > max) { dx = dx/d*max; dy = dy/d*max; }
  joyX = dx / max;
  joyY = dy / max;
  stickEl.style.transform = `translate(${dx}px, ${dy}px)`;
  e.preventDefault();
}
function joyEnd(e) {
  joyActive = false; joyX = 0; joyY = 0;
  stickEl.style.transform = '';
  e.preventDefault();
}
joyEl.addEventListener('touchstart', joyStart, { passive:false });
joyEl.addEventListener('touchmove', joyMove, { passive:false });
joyEl.addEventListener('touchend', joyEnd);
joyEl.addEventListener('touchcancel', joyEnd);

let kickPressed = false, sprintPressed = false;
function bindBtn(el, on, off) {
  el.addEventListener('touchstart', e => { on(); e.preventDefault(); }, { passive:false });
  el.addEventListener('touchend', e => { off(); e.preventDefault(); });
  el.addEventListener('mousedown', e => { on(); e.preventDefault(); });
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindBtn(document.getElementById('kickBtn'), () => kickPressed = true, () => kickPressed = false);
bindBtn(document.getElementById('sprintBtn'), () => sprintPressed = true, () => sprintPressed = false);

// ============ SOCKET EVENTS ============
socket.on('init', (data) => {
  myId = data.id;
  gameState = data.state;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('teamInfo').textContent = 
    `Bạn: ${data.state.players[myId].team.toUpperCase()} · Online: ${Object.keys(data.state.players).length}`;
  
  // Tạo model cho tất cả player hiện có
  for (const id in data.state.players) {
    if (id === myId) continue;
    addPlayerModel(id, data.state.players[id]);
  }
});

socket.on('playerJoined', ({ id, player }) => {
  addPlayerModel(id, player);
  updateOnlineCount();
});

socket.on('playerLeft', (id) => {
  if (playerModels[id]) {
    scene.remove(playerModels[id]);
    delete playerModels[id];
  }
  updateOnlineCount();
});

socket.on('state', (s) => {
  gameState = s;
  
  // Update ball
  ball.position.set(s.ball.x, s.ball.y, s.ball.z);
  
  // Update players
  for (const id in s.players) {
    if (id === myId) continue;
    const p = s.players[id];
    if (!playerModels[id]) addPlayerModel(id, p);
    const model = playerModels[id];
    // Smooth lerp
    model.position.lerp(new THREE.Vector3(p.x, p.y, p.z), 0.25);
    model.rotation.y = p.ry;
    // Update label text
    const label = model.getObjectByName('label');
    if (label && label.userData.name !== p.name) {
      updateLabel(label, p.name);
      label.userData.name = p.name;
    }
  }
  
  // Scores UI
  document.getElementById('ui').textContent = `⚽ ${s.scores.red} - ${s.scores.blue}`;
});

socket.on('goal', ({ team, scores }) => {
  const flash = document.getElementById('goalFlash');
  flash.textContent = team === 'red' ? '🔴 GOAL RED!' : '🔵 GOAL BLUE!';
  flash.style.opacity = 1;
  setTimeout(() => flash.style.opacity = 0, 1200);
});

function addPlayerModel(id, data) {
  const model = createPlayerModel(data.color);
  model.position.set(data.x, data.y, data.z);
  model.rotation.y = data.ry;
  const label = model.getObjectByName('label');
  updateLabel(label, data.name);
  label.userData.name = data.name;
  scene.add(model);
  playerModels[id] = model;
}

function updateLabel(label, text) {
  const canvas = label.material.map.image;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  label.material.map.needsUpdate = true;
}

function updateOnlineCount() {
  const count = gameState ? Object.keys(gameState.players).length : 1;
  document.getElementById('teamInfo').textContent = 
    `Bạn: ${gameState.players[myId].team.toUpperCase()} · Online: ${count}`;
}

// ============ INPUT SEND LOOP (20Hz) ============
setInterval(() => {
  if (!socket.connected) return;
  
  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  mx += joyX;
  mz += joyY;
  
  socket.emit('input', {
    mx, mz,
    kick: kickPressed || keys['Space'],
    sprint: sprintPressed || keys['ShiftLeft'] || keys['ShiftRight']
  });
  kickPressed = false;
}, 50);

// ============ RENDER LOOP ============
function animate() {
  requestAnimationFrame(animate);
  
  if (gameState && gameState.players[myId]) {
    const me = gameState.players[myId];
    // Camera follow
    const target = new THREE.Vector3(me.x * 0.4, 20, me.z + 22);
    camera.position.lerp(target, 0.08);
    camera.lookAt(me.x * 0.3, 0, me.z - 5);
    
    // Update own model
    if (!playerModels[myId]) {
      const m = createPlayerModel(me.color);
      m.position.set(me.x, me.y, me.z);
      updateLabel(m.getObjectByName('label'), me.name + ' (Bạn)');
      scene.add(m);
      playerModels[myId] = m;
    } else {
      const m = playerModels[myId];
      m.position.lerp(new THREE.Vector3(me.x, me.y, me.z), 0.4);
      m.rotation.y = me.ry;
    }
  }
  
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
